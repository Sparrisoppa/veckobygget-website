<section class="section wrap services"{{ with .Params.anchor }} id="{{ . }}"{{ end }}>
  <div class="section-intro">
    <h2 class="h2">{{ .Title }}</h2>
    {{- with .Params.intro }}<p class="lead">{{ . }}</p>{{ end }}
  </div>
  <div class="cards">
    {{- range .Params.items }}
    <div class="card">
      {{- with .icon }}{{ partial "icon.html" . }}{{ end }}
      <h3>{{ .title }}</h3>
      <p>{{ .body }}</p>
      {{- with .link }}<a class="link" href="{{ .href }}">{{ .text }}</a>{{ end }}
    </div>
    {{- end }}
  </div>
  {{- with .Params.note }}<p class="services__note">{{ . }}</p>{{ end }}
</section>
