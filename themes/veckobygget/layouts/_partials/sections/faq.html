<section class="section--white"{{ with .Params.anchor }} id="{{ . }}"{{ end }}>
  <div class="section wrap faq">
    <h2 class="h2">{{ .Title }}</h2>
    <div class="faq__list">
      {{- range $f := .Params.items }}
      <details>
        <summary>{{ $f.q }}</summary>
        <div class="md">{{ $f.a | replaceRE `\{price\}` (printf "%s kr" (partial "price.html" site.Params.price)) | markdownify }}</div>
      </details>
      {{- end }}
    </div>
  </div>
</section>
