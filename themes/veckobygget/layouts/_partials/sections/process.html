<section class="section wrap process"{{ with .Params.anchor }} id="{{ . }}"{{ end }}>
  <h2 class="h2">{{ .Title }}</h2>
  <ol class="steps">
    {{- range $i, $s := .Params.steps }}
    <li class="step">
      <span class="step__n">{{ add $i 1 }}</span>
      <h3>{{ $s.title }}</h3>
      <p>{{ $s.body }}</p>
    </li>
    {{- end }}
  </ol>
  {{- with .Params.note }}<p class="process__note">{{ . }}</p>{{ end }}
</section>
